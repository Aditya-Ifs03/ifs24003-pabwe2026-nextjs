# ============================================================================
# Konfigurasi SonarQube — ifs24003-pabwe2026-nextjs
#
# PENTING: nilai sonar.projectKey dan sonar.projectName HARUS sama persis
# dengan nama repository GitHub, nama item Jenkins, dan nama proyek SonarQube.
# Ganti ifs24003-pabwe2026-nextjs di bawah bila nama repo kamu berbeda.
# ============================================================================
sonar.projectKey=ifs24003-pabwe2026-nextjs
sonar.projectName=ifs24003-pabwe2026-nextjs

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ----------------------------------------------------------------------------
# Berkas yang tidak dianalisis sama sekali.
# Selaras dengan pengecualian pada vitest.config.mts.
# ----------------------------------------------------------------------------
sonar.exclusions=node_modules/**,coverage/**,.next/**,out/**,public/**,src/setupTests.ts,src/test-utils.tsx,src/navigation-mock.ts,**/*.test.ts,**/*.test.tsx

# ----------------------------------------------------------------------------
# Berkas yang tetap dianalisis (dicek bug/code smell-nya) tetapi tidak dihitung
# dalam persentase coverage, karena memang tidak diukur oleh Vitest:
#   - src/app/**     : pembungkus rute App Router (beberapa baris saja)
#   - src/server.ts  : bootstrap server launcher
#   - src/types/**   : hanya berisi deklarasi tipe
# Daftar ini HARUS sama dengan `coverage.exclude` pada vitest.config.mts agar
# angka coverage SonarQube konsisten dengan hasil `bun run test`.
# ----------------------------------------------------------------------------
sonar.coverage.exclusions=src/app/**,src/server.ts,src/types/**,src/setupTests.ts,src/test-utils.tsx,src/navigation-mock.ts,**/*.test.ts,**/*.test.tsx